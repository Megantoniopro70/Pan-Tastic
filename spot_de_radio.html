<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanTastic | Panadería Artesanal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    :root {
        --bg-color: #F9F6F0; 
        --nav-bg: #4A3B32; 
        --accent: #D97736; 
        --text-main: #333333;
        --text-light: #666666;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: var(--bg-color);
        font-family: 'Poppins', sans-serif;
        color: var(--text-main);
        overflow-x: hidden;
    }

    h1, h2, h3 {
        font-family: 'Lora', serif;
        color: var(--nav-bg);
    }

    /* --- NAVBAR --- */
    .navbar {
        width: 100%;
        background-color: var(--nav-bg);
        padding: 15px 0;
        position: fixed;   
        top: 0;
        left: 0;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .nav-container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        display: flex;
        align-items: center;
        color: white;
        font-size: 24px;
        font-weight: 600;
        font-family: 'Lora', serif;
        text-decoration: none;
    }

    .logo img {
        height: 50px;
        width: 50px;
        border-radius: 50%;
        margin-right: 12px;
        object-fit: cover;
    }

    .nav-menu {
        display: flex;
        gap: 40px;
        align-items: center;
    }

    .nav-menu a {
        text-decoration: none;
        color: #E8E8E8;
        font-size: 15px;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .nav-menu a:hover {
        color: var(--accent);
    }

    .nav-menu .btn {
        background-color: var(--accent);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        transition: transform 0.3s ease, background-color 0.3s;
    }

    .nav-menu .btn:hover {
        background-color: #BF652A;
        color: white;
        transform: scale(1.05);
    }

    .menu-toggle {
        display: none;
        font-size: 28px;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    /* --- SCROLL SNAP & SECCIONES --- */
    .scroller {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
    }

    .scroller::-webkit-scrollbar {
        width: 8px;
    }
    .scroller::-webkit-scrollbar-thumb {
        background-color: var(--nav-bg);
        border-radius: 4px;
    }

    .section {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        scroll-snap-align: center;
        padding: 100px 20px 40px 20px; 
    }

    /* --- TARJETAS --- */
    .card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        padding: 3rem;
        width: 100%;
        max-width: 1100px;
    }

    .layout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 3rem;
    }

    .text {
        flex: 1;
        text-align: left;
    }

    .text h2 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin-bottom: 1.5rem;
    }

    .text h2::after {
        content: '';
        display: block;
        width: 60px;
        height: 4px;
        background-color: var(--accent);
        margin-top: 10px;
        border-radius: 2px;
    }

    .text p {
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--text-light);
    }

    .text strong {
        color: var(--nav-bg);
    }

    .image {
        flex: 1;
        display: flex;
        justify-content: center;
    }

    .image img {
        width: 100%;
        max-width: 400px;
        height: auto;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        transition: transform 0.4s ease;
    }

    .image img:hover {
        transform: translateY(-10px);
    }

    .reverse-layout {
        flex-direction: row-reverse;
    }

    /* --- CONTACTO --- */
    .contact-layout {
        display: flex;
        gap: 3rem;
        align-items: stretch;
    }

    .contact-info {
        flex: 1;
        background-color: var(--bg-color);
        padding: 2rem;
        border-radius: 16px;
        text-align: left;
    }

    .info-item {
        display: flex;
        align-items: flex-start;
        gap: 15px;
        margin-bottom: 1.5rem;
        color: var(--text-light);
    }

    .info-item i {
        color: var(--accent);
        font-size: 1.2rem;
        margin-top: 4px;
    }

    .contact-form {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 5px;
        color: var(--nav-bg);
        text-align: left;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        background-color: #fcfcfc;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--accent);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .btn-submit {
        background-color: var(--nav-bg);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background-color: var(--accent);
    }

    .mini-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.9rem;
        color: #999;
        border-top: 1px solid #eee;
        padding-top: 1rem;
    }

    /* ========================================= */
    /* TU MENÚ CIRCULAR ANIMADO EXACTO           */
    /* ========================================= */
    .menu {
        position: fixed;      
        bottom: 25px;          
        right: 25px;          
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;        
    }

    .menu .toggle {
        width: 70px;
        height: 70px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--nav-bg);
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        z-index: 10;
        transition: 0.5s;
    }

    .menu.active .toggle {
        transform: rotate(45deg);
        background: var(--nav-bg);
        color: white;
    }

    .menu ul {
        position: absolute;
        width: 100%;
        height: 100%;
        list-style: none;
    }

    .menu ul li {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 55px;
        height: 55px;
        background: var(--clr);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        transition: 0.6s;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .menu.active ul li {
        --angle: calc(var(--i) * 28deg);
        transform: translate(
            calc(-50% - 110px * cos(var(--angle))),
            calc(-50% - 110px * sin(var(--angle)))
        );
    }

    .menu ul li a {
        color: white;
        font-size: 1.4rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }

    .menu ul li.whatsapp {
        background: #25D366;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 850px) {
        .menu-toggle { display: block; }
        .nav-menu {
            position: fixed; top: 70px; right: -100%; background: var(--nav-bg);
            flex-direction: column; width: 250px; height: calc(100vh - 70px);
            padding: 40px 30px; gap: 30px; transition: right 0.4s ease;
        }
        .nav-menu.active { right: 0; }
        .layout, .reverse-layout, .contact-layout { flex-direction: column; text-align: center; }
        .text { text-align: center; }
        .text h2::after { margin: 10px auto 0; }
        
        .menu {
            bottom: 15px;
            right: 15px;
            transform: scale(0.85);
        }
    }

    /* --- ESTILOS ICONOS 3D PANTASTIC --- */
.social-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 50px;
}

.social-container a {
    position: relative;
    text-decoration: none;
    color: var(--nav-bg); /* Usa el café de tu paleta */
    display: block;
    text-align: center;
}

.social-container a .layer {
    width: 60px;
    height: 60px;
    transition: transform 0.3s;
    position: relative;
}

.social-container a:hover .layer {
    transform: rotate(-35deg) skew(20deg);
}

.social-container a .layer span {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    border: 1px solid var(--nav-bg);
    border-radius: 8px;
    transition: all 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
}

.social-container a .layer span.fab, 
.social-container a .layer span.fa-brands {
    font-size: 30px;
}

/* Efecto de capas al pasar el mouse */
.social-container a:hover .layer span:nth-child(1) { opacity: 0.2; }
.social-container a:hover .layer span:nth-child(2) { opacity: 0.4; transform: translate(5px, -5px); }
.social-container a:hover .layer span:nth-child(3) { opacity: 0.6; transform: translate(10px, -10px); }
.social-container a:hover .layer span:nth-child(4) { opacity: 0.8; transform: translate(15px, -15px); }
.social-container a:hover .layer span:nth-child(5) { transform: translate(20px, -20px); }

/* Colores personalizados al Hover (usando tus variables) */
.social-container a:hover .layer span { 
    border-color: var(--accent); 
    color: var(--accent); 
}
/* --- RESPONSIVE ICONOS REDES --- */
@media (max-width: 600px) {

    .social-container {
        flex-wrap: wrap;          /* Permite que bajen a otra fila */
        gap: 20px;
    }

    .social-container a .layer {
        width: 50px;              /* Reduce tamaño */
        height: 50px;
    }

    .social-container a .layer span.fab,
    .social-container a .layer span.fa-brands {
        font-size: 22px;          /* Reduce ícono */
    }

    .social-container {
        margin-top: 30px;
    }
}

.social-container a .icon-text {
    margin-top: 15px;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
    opacity: 0;
    color: var(--accent);
}

.social-container a:hover .icon-text {
    opacity: 1;
    transform: translateY(10px);
}
/* --- MAPA GOOGLE --- */
.map-container {
    margin-top: 2rem;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

.map-container iframe {
    width: 100%;
    height: 300px;
    border: 0;
}

    /* --- RESPONSIVE --- */
    @media (max-width: 850px) {
        .menu-toggle { display: block; }
        .nav-menu {
            position: fixed; top: 70px; right: -100%; background: var(--nav-bg);
            flex-direction: column; width: 250px; height: calc(100vh - 70px);
            padding: 40px 30px; gap: 30px; transition: right 0.4s ease;
        }
        .nav-menu.active { right: 0; }
        .layout, .reverse-layout, .contact-layout { flex-direction: column; text-align: center; }
        .text { text-align: center; }
        .text h2::after { margin: 10px auto 0; }
        
        .menu {
            bottom: 15px;
            right: 15px;
            transform: scale(0.85);
        }
    }

    /* Nuevo estilo para el botón Spot de Radio */
.btn-spot {
    background-color: var(--accent); /* El color de fondo será el de la paleta de la web */
    color: white;                    /* Texto en blanco */
    padding: 12px 25px;              /* Aumentamos el tamaño del botón para hacerlo más prominente */
    font-size: 1.1rem;               /* Tamaño de fuente cómodo */
    border-radius: 25px;             /* Bordes redondeados */
    font-weight: 600;                /* Texto en negrita */
    text-align: center;              /* Alineación de texto centrado */
    display: inline-block;           /* Para asegurar que el botón se vea correctamente */
    text-decoration: none;           /* Eliminamos subrayado del enlace */
    transition: transform 0.3s ease, background-color 0.3s ease; /* Animaciones */
}

.btn-spot:hover {
    background-color: #BF652A; /* Cuando se pasa el mouse, cambia el color */
    transform: scale(1.05); /* Animación de escala al pasar el mouse */
}

.player-card {
    display: flex;
    flex-direction: row;
    background-color: var(--bg-color);
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    overflow: hidden;
    max-width: 700px;
    margin: 2rem auto;
    padding: 15px;
}

.player-card .cover img {
    width: 180px;
    height: 180px;
    border-radius: 20px;
    object-fit: cover;
}

.player-card .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 15px 20px;
}

.player-card .title {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    color: var(--nav-bg);
    margin-bottom: 5px;
}

.player-card .artist {
    font-size: 0.95rem;
    color: var(--text-light);
    margin-bottom: 15px;
}

.player-card .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.player-card .controls button {
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: transform 0.2s ease;
}

.player-card .controls button:hover {
    transform: scale(1.1);
}

.player-card #progress {
    width: 100%;
    accent-color: var(--accent);
}

/* Responsivo */
@media (max-width: 600px){
    .player-card {
        flex-direction: column;
        align-items: center;
        padding: 15px;
    }
    .player-card .cover img {
        width: 100%;
        height: auto;
        margin-bottom: 15px;
    }
    .player-card .info {
        padding: 0;
        text-align: center;
    }
}
</style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><img src="img/1.jpeg" alt="Logo">PanTastic</a>
            <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="publicidad.html">Regresar</a>
            </nav>
        </div>
    </header>   




    <div class="scroller">


       <div class="section">
    <div class="card">
        <div class="layout">
            <div class="text">
               <center> <h2>Spot de Radio</h2></center>
                <div class="player-card">
    <div class="cover">
        <img src="img/1.jpeg" alt="Portada de la canción">
    </div>
    <div class="info">
        <div class="title">Pan-Tastic</div>
        <div class="artist">pan-tastic</div>
        <audio id="audio" src="img/audio1.mpeg"></audio>
        <div class="controls">
            <button id="play">&#9654;</button>
        </div>
        <input type="range" id="progress" value="0" min="0" max="100">

    </div>
</div>
               <center><p>Valla al menú si desea regresar</p></center> 
            </div>
        </div>
    </div>
</div>

    
 
    </div>

    <script>
        // Funcionalidad Menú Arriba
        const toggleNav = document.getElementById("menu-toggle");
        const menuNav = document.getElementById("nav-menu");
        toggleNav.addEventListener("click", () => {
            menuNav.classList.toggle("active");
        });

        // Funcionalidad de Tu Menú Circular Abajo
        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        toggleBtn.addEventListener('click', () => {
            circularMenu.classList.toggle('active');
        });
    </script>
<script>
// Seleccionamos los elementos del reproductor
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const progress = document.getElementById('progress');

// Función para alternar play/pause
playBtn.addEventListener('click', () => {
    if(audio.paused){
        audio.play();
        playBtn.textContent = '⏸'; // Cambia el icono a pausa
    } else{
        audio.pause();
        playBtn.textContent = '▶'; // Cambia el icono a play
    }
});

// Actualizar la barra de progreso mientras se reproduce el audio
audio.addEventListener('timeupdate', () => {
    if(audio.duration){
        const percent = (audio.currentTime / audio.duration) * 100;
        progress.value = percent;
    }
});

// Permitir mover el audio arrastrando la barra
progress.addEventListener('input', () => {
    if(audio.duration){
        audio.currentTime = (progress.value / 100) * audio.duration;
    }
});
</script>
</body>
</html>
